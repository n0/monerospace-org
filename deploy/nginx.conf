worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Security headers (origin-level). Inherited by every response that does
    # not set its own add_header — i.e. all HTML/SPA + proxied routes below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      proxy_pass http://127.0.0.1:8999/healthz;
    }

    location /api/v1/ws {
      proxy_pass http://127.0.0.1:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    location /ws {
      proxy_pass http://127.0.0.1:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    location /api/v1/ {
      proxy_pass http://127.0.0.1:8999/api/v1/;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8999/api/v1/;
      proxy_set_header Host $host;
    }

    location /resources/ {
      try_files $uri =404;
      expires 1h;
    }

    # Real sitemap from the backend, ahead of the SPA catch-all.
    location = /sitemap.xml {
      proxy_pass http://127.0.0.1:8999/sitemap.xml;
      proxy_set_header Host $host;
    }

    # Version-controlled robots.txt (note: a Cloudflare-managed robots.txt may
    # still override this at the edge).
    location = /robots.txt {
      try_files $uri /en-US/robots.txt =404;
    }

    # Content-hashed bundles are immutable — cache them for a year. The hash
    # segment in the regex keeps un-hashed files (e.g. /resources/config.js)
    # out of this rule so they stay on the shorter cache.
    location ~* "\.[0-9a-f]{8,}\.(?:js|css|woff2?|ttf|otf|eot|svg|webp|png|jpe?g|gif)$" {
      try_files $uri /en-US$uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = / {
      try_files /en-US/index.html =404;
      expires 10m;
    }

    location ~ ^/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi|ne|lt|hr)/ {
      try_files $uri/index.html $uri /$1/index.html /en-US/index.html =404;
    }

    location / {
      try_files $uri/index.html $uri /en-US$uri /en-US/index.html =404;
      expires 10m;
    }
  }
}
