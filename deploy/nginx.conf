worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/browser;
    index index.html;

    location = /healthz {
      proxy_pass http://127.0.0.1:8999/healthz;
    }

    location /api/v1/ws {
      proxy_pass http://127.0.0.1:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    location /ws {
      proxy_pass http://127.0.0.1:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    location /api/v1/ {
      proxy_pass http://127.0.0.1:8999/api/v1/;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8999/api/v1/;
      proxy_set_header Host $host;
    }

    location /resources/ {
      try_files $uri =404;
      expires 1h;
    }

    location = / {
      try_files /en-US/index.html =404;
      expires 10m;
    }

    location ~ ^/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi|ne|lt|hr)/ {
      try_files $uri/index.html $uri /$1/index.html /en-US/index.html =404;
    }

    location / {
      try_files $uri/index.html $uri /en-US/index.html =404;
      expires 10m;
    }
  }
}
