services:
  monerospace:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - coolify
    labels:
      caddy_0: "https://monerospace.org"
      caddy_0.encode: "zstd gzip"
      caddy_0.handle_path: "/*"
      caddy_0.handle_path.0_reverse_proxy: "{{upstreams 80}}"
      caddy_0.header: "-Server"
      caddy_0.try_files: "{path} /index.html /index.php"
      caddy_1: "https://www.monerospace.org"
      caddy_1.encode: "zstd gzip"
      caddy_1.handle_path: "/*"
      caddy_1.handle_path.1_reverse_proxy: "{{upstreams 80}}"
      caddy_1.header: "-Server"
      caddy_1.try_files: "{path} /index.html /index.php"
      caddy_ingress_network: "coolify"
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.middlewares.gzip.compress: "true"
      traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: "https"
      traefik.http.routers.http-0-monerospace.entryPoints: "http"
      traefik.http.routers.http-0-monerospace.middlewares: "redirect-to-https"
      traefik.http.routers.http-0-monerospace.rule: "Host(`monerospace.org`) && PathPrefix(`/`)"
      traefik.http.routers.http-0-monerospace.service: "http-0-monerospace"
      traefik.http.routers.http-1-monerospace.entryPoints: "http"
      traefik.http.routers.http-1-monerospace.middlewares: "redirect-to-https"
      traefik.http.routers.http-1-monerospace.rule: "Host(`www.monerospace.org`) && PathPrefix(`/`)"
      traefik.http.routers.http-1-monerospace.service: "http-1-monerospace"
      traefik.http.routers.https-0-monerospace.entryPoints: "https"
      traefik.http.routers.https-0-monerospace.middlewares: "gzip"
      traefik.http.routers.https-0-monerospace.rule: "Host(`monerospace.org`) && PathPrefix(`/`)"
      traefik.http.routers.https-0-monerospace.service: "https-0-monerospace"
      traefik.http.routers.https-0-monerospace.tls: "true"
      traefik.http.routers.https-0-monerospace.tls.certresolver: "letsencrypt"
      traefik.http.routers.https-1-monerospace.entryPoints: "https"
      traefik.http.routers.https-1-monerospace.middlewares: "gzip"
      traefik.http.routers.https-1-monerospace.rule: "Host(`www.monerospace.org`) && PathPrefix(`/`)"
      traefik.http.routers.https-1-monerospace.service: "https-1-monerospace"
      traefik.http.routers.https-1-monerospace.tls: "true"
      traefik.http.routers.https-1-monerospace.tls.certresolver: "letsencrypt"
      traefik.http.services.http-0-monerospace.loadbalancer.server.port: "80"
      traefik.http.services.http-1-monerospace.loadbalancer.server.port: "80"
      traefik.http.services.https-0-monerospace.loadbalancer.server.port: "80"
      traefik.http.services.https-1-monerospace.loadbalancer.server.port: "80"
    environment:
      XMR_HOST: "127.0.0.1"
      XMR_PORT: "8999"
      XMR_INDEX_DIR: "/data/xmr"
      XMR_POLL_MS: "5000"
      MONEROD_RPC_URL: "${MONEROD_RPC_URL:-https://xmr-node.cakewallet.com:18081}"
      MONEROD_RPC_TIMEOUT_MS: "10000"
      MONEROD_RPC_RETRIES: "3"
      MONEROD_RPC_RETRY_BACKOFF_MS: "750"
      XMR_DATABASE_ENABLED: "false"
      DATABASE_ENABLED: "false"
      XMR_INDEXER_BACKFILL_CONCURRENCY: "1"
      XMR_INDEXER_FAST_PASS_DAYS: "7"
      XMR_INDEXER_DEEP_PASS_DAYS: "90"
      XMR_PRICE_BACKFILL_ON_DEMAND: "false"
      NODE_MAX_OLD_SPACE_SIZE: "2048"
    volumes:
      - monerospace-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz | grep -q xmr-space-backend"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  monerospace-data:

networks:
  coolify:
    external: true
