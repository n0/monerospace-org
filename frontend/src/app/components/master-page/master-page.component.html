<ng-container *ngIf="{ val: network$ | async } as network">
<header *ngIf="headerVisible" class="sticky-header">

  <nav class="navbar navbar-expand-md navbar-dark">
  <!-- Large screen -->
  <a class="navbar-brand d-none d-md-flex" [ngClass]="{'dual-logos': enterpriseInfo?.dualLogo}" [routerLink]="['/' | relativeUrl]" (click)="brandClick($event)" aria-label="monerospace.org dashboard" title="monerospace.org dashboard">
    <ng-container *ngIf="{ val: connectionState$ | async } as connectionState">
      @if (enterpriseInfo) {
        <div class="subdomain_container">
          <img [src]="enterpriseInfo.logoUrl" [alt]="enterpriseInfo.title" class="subdomain_logo" [class.custom_logo]="!enterpriseInfo?.dualLogo" [class.rounded]="enterpriseInfo.rounded_corner">
        </div>
        @if (enterpriseInfo.dualLogo) {
          <div class="vertical-line"></div>
        }
      }
      @if (!enterpriseInfo || enterpriseInfo.dualLogo) {
        <app-svg-images name="mempoolSpace" viewBox="0 0 500 126" class="mempool-logo" [ngStyle]="{'opacity': connectionState.val === 2 ? 1 : 0.5 }"></app-svg-images>
      }
      <div class="connection-badge">
        <div class="badge bg-warning" *ngIf="connectionState.val === 0" i18n="master-page.offline">Offline</div>
        <div class="badge bg-warning" *ngIf="connectionState.val === 1" i18n="master-page.reconnecting">Reconnecting...</div>
      </div>
    </ng-container>
  </a>
  <!-- Mobile -->
  <a class="navbar-brand d-flex d-md-none justify-content-center" [ngClass]="{'dual-logos': enterpriseInfo?.dualLogo, 'me-0': enterpriseInfo?.dualLogo}" [routerLink]="['/' | relativeUrl]" (click)="brandClick($event)" aria-label="monerospace.org dashboard" title="monerospace.org dashboard">
    <ng-container *ngIf="{ val: connectionState$ | async } as connectionState">
      @if (enterpriseInfo) {
        <div class="subdomain_container">
          <img [src]="enterpriseInfo.logoUrl" [alt]="enterpriseInfo.title" class="subdomain_logo mobile_logo" [class.custom_logo]="!enterpriseInfo?.dualLogo" [class.rounded]="enterpriseInfo.rounded_corner">
        </div>
        @if (enterpriseInfo.dualLogo) {
          <div class="vertical-line"></div>
        }
      }
      @if (!enterpriseInfo || enterpriseInfo.dualLogo) {
        <app-svg-images name="mempoolSpace" viewBox="0 0 500 126" class="mempool-logo" [ngStyle]="{'opacity': connectionState.val === 2 ? 1 : 0.5 }"></app-svg-images>
      }
      <div class="connection-badge">
        <div class="badge bg-warning" *ngIf="connectionState.val === 0" i18n="master-page.offline">Offline</div>
        <div class="badge bg-warning" *ngIf="connectionState.val === 1" i18n="master-page.reconnecting">Reconnecting...</div>
      </div>
    </ng-container>
  </a>

  <div class="navbar-collapse" id="navbarCollapse">
    <ul class="navbar-nav {{ network.val }}">

      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page" id="btn-home">
        <a class="nav-link" [routerLink]="['/' | relativeUrl]" (click)="collapse()" aria-label="Dashboard" title="Dashboard">
          <div class="svg-wrapper"><app-svg-images name="nav-tachometer" width="21.59" height="100%"></app-svg-images></div>
        </a>
      </li>
      <!-- xmr-space: pruned nav. Removed parent-chain-only items:
           paid fee-bump service, mining-pool dashboard
           (we have miner_tx_hash but no per-pool reward share), lightning
           (no second layer), faucet (no test-net wiring), enterprise
           (mempool's commercial brand). Kept: home, blocks list, graphs,
           docs, about. -->
      <li class="nav-item" routerLinkActive="active" ariaCurrentWhenActive="page" id="btn-blocks">
        <a class="nav-link" [routerLink]="['/blocks' | relativeUrl]" (click)="collapse()" aria-label="Recent blocks" title="Recent blocks">
          <div class="svg-wrapper"><app-svg-images name="nav-cubes" width="21.59" height="100%"></app-svg-images></div>
        </a>
      </li>
      <li class="nav-item" routerLinkActive="active" ariaCurrentWhenActive="page" id="btn-graphs">
        <a class="nav-link" [routerLink]="['/graphs' | relativeUrl]" (click)="collapse()" aria-label="Graphs" title="Graphs">
          <div class="svg-wrapper"><app-svg-images name="nav-chart-area" width="21.59" height="100%"></app-svg-images></div>
        </a>
      </li>
      <li class="nav-item" routerLinkActive="active" ariaCurrentWhenActive="page" id="btn-docs">
        <a class="nav-link" [routerLink]="['/docs' | relativeUrl ]" (click)="collapse()" aria-label="Documentation" title="Documentation">
          <div class="svg-wrapper"><app-svg-images name="nav-book" width="21.59" height="100%"></app-svg-images></div>
        </a>
      </li>
      <li class="nav-item" routerLinkActive="active" ariaCurrentWhenActive="page" id="btn-about">
        <a class="nav-link" [routerLink]="['/about']" (click)="collapse()" aria-label="About monerospace.org" title="About monerospace.org">
          <div class="svg-wrapper"><app-svg-images name="nav-info-circle" width="21.59" height="100%"></app-svg-images></div>
        </a>
      </li>
    </ul>
    <app-search-form [hamburgerOpen]="false" class="search-form-container" location="top" (searchTriggered)="collapse()"></app-search-form>
  </div>
</nav>
</header>

<div class="d-flex" style="overflow: clip">
  <div class="empty-sidenav"><!-- empty sidenav needed to push footer down the screen --></div>

  <div class="flex-grow-1 d-flex flex-column">
    <main style="min-width: 375px; max-width: 100vw">
      <router-outlet></router-outlet>
    </main>

    <div class="flex-grow-1"></div>
    <app-global-footer *ngIf="footerVisible"></app-global-footer>
  </div>
</div>

</ng-container>
