<button *ngIf="!widget && (bufferedCount$ | async) > 0 && !(manualPaused$ | async)"
  type="button"
  class="new-tx-pill"
  (click)="scrollToTop()"
  data-cy="new-tx-pill">
  <fa-icon [icon]="['fas', 'angle-up']" [fixedWidth]="true"></fa-icon>
  <span *ngIf="(bufferedCount$ | async) === 1" i18n="recent-transactions.new-tx-pill.singular">1 new transaction</span>
  <span *ngIf="(bufferedCount$ | async) > 1" i18n="recent-transactions.new-tx-pill.plural">{{ bufferedCount$ | async }} new transactions</span>
</button>

<div [class.container-xl]="!widget" [class.widget]="widget" [style.min-height.px]="widget ? null : 335">
  <div class="title-row" *ngIf="!widget">
    <h1 i18n="page.recent-transactions">Recent Transactions</h1>

    <div class="controls">
      <div class="btn-group" role="group">
        <button *ngFor="let limit of limitOptions"
          type="button"
          class="btn btn-primary btn-sm"
          [class.active]="(limit$ | async) === limit"
          [attr.data-cy]="'limit-' + limit"
          (click)="setLimit(limit)">
          {{ limit }}
        </button>
      </div>
      <button class="btn btn-primary btn-sm btn-pause" [class.active]="manualPaused$ | async" (click)="togglePause()" title="Pause/Resume" i18n-title="recent-transactions.pause-toggle.title|Tooltip for the pause/resume updates button" aria-label="Pause/Resume" i18n-aria-label="recent-transactions.pause-toggle.aria-label|Accessible label for the pause/resume updates button" data-cy="btn-pause">
        <fa-icon [icon]="['fas', (manualPaused$ | async) ? 'play' : 'pause']" [fixedWidth]="true"></fa-icon>
      </button>
    </div>
  </div>

  <table class="table latest-transactions">
    <thead>
      <!-- xmr-space: removed Fiat + Amount columns from the recent-tx
           widget. Tx amounts are RingCT-hidden by design; surfacing
           '0.00 XMR' is misleading. The reveal flows on /tx/:hash give
           participants the legitimate path to see amounts. -->
      <th class="table-cell-txid" i18n="dashboard.latest-transactions.txid">TXID</th>
      <th class="table-cell-size" *ngIf="!widget" i18n="transaction.vsize|Transaction Virtual Size">Size</th>
      <th class="table-cell-fees" i18n="transaction.fee|Transaction fee">Fee</th>
    </thead>
    <tbody data-cy="transactions-list" *ngIf="transactions$ | async as transactions; else skeleton">
      <tr *ngFor="let transaction of transactions; trackBy: trackByTxid">
        <td class="table-cell-txid">
          <a [routerLink]="['/tx' | relativeUrl, transaction.txid]">
            <app-truncate [text]="transaction.txid" [lastChars]="5"></app-truncate>
          </a>
        </td>
        <td class="table-cell-size" *ngIf="!widget" [innerHTML]="'&lrm;' + (transaction.vsize | bytes: 2)"></td>
        <td class="table-cell-fees">
          <!-- weight=vsize on Monero (no segwit) — pass it directly so
               fee-rate computes fee/weight for ɱ/B output. -->
          <app-fee-rate [fee]="transaction.fee" [weight]="transaction.vsize"></app-fee-rate>
        </td>
      </tr>
      <tr *ngIf="!widget && transactions.length === 0" data-cy="transactions-empty-row">
        <td class="text-muted" colspan="3" i18n="recent-transactions.empty">No transactions currently in the mempool.</td>
      </tr>
    </tbody>
    <ng-template #skeleton>
      <tbody>
        <tr *ngFor="let i of (widget ? [1,2,3,4,5,6] : [1])">
          <td class="table-cell-txid"><span class="skeleton-loader"></span></td>
          <td class="table-cell-size" *ngIf="!widget"><span class="skeleton-loader"></span></td>
          <td class="table-cell-fees"><span class="skeleton-loader"></span></td>
        </tr>
      </tbody>
    </ng-template>
  </table>
</div>
