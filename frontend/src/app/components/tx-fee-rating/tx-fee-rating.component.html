<!-- xmr-space: tx-fee-rating computes "Overpaid Nx" by comparing this
     tx's rate against the block's median rate. On Monero the spread of
     fee tiers is wider (slow ~20k vs fastest ~4M = 200x) so users
     paying the fastest tier would always see "Overpaid 200x" which is
     misleading — Monero treats the four tiers as legitimate priority
     choices. Suppress the warning/danger badges; show "Optimal" only
     for the lowest tier where the comparison still makes sense. -->
<span *ngIf="feeRating === 1" class="badge bg-success" i18n="tx-fee-rating.optimal|TX Fee Rating is Optimal">Optimal</span>
